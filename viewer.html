<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haircut</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d23; color: #e8e8e8;
               font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #hud { position: fixed; top: 12px; left: 14px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud small { color: #aab3bd; }
  #hud b { color: #ff6b6b; }
  #feeds { position: fixed; right: 14px; bottom: 50px; width: min(300px, 37vw, 47vh); display: grid;
           gap: 8px; pointer-events: none; }
  #feeds[hidden] { display: none; }
  .feed { aspect-ratio: 4 / 3; box-sizing: border-box; border: 1px solid #8a94a0;
          padding: 2px 6px; font-size: 12px; text-shadow: 0 1px 2px #000; }
  #view-label { position: fixed; right: 14px; top: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #bar { position: fixed; bottom: 12px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: center; }
  #t { flex: 1; }
  button { font: inherit; padding: 2px 10px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="feeds"><div class="feed" id="orbit-feed">Orbit camera</div><div class="feed" id="blade-feed">Blade camera</div></div>
<div id="view-label" hidden></div>
<div id="bar"><button id="play"></button><input id="t" type="range" min="0" value="0" aria-label="step"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// haircut.py fills this in for a replay: {grid, cells, reach, target, frames}.
// Left as null, the page is live: it asks the `serve` process for the state and sends it actions.
// All rules and rewards live in Python. This file draws, and animates hair for looks only.
const EMBED = /*REPLAY*/null;
const HEAD_SCAN = /*HEAD_SCAN*/"";
const CAPTURE = EMBED === null && new URLSearchParams(location.search).has('capture');
const LIVE = EMBED === null && !CAPTURE;
const R = EMBED ?? await (await fetch('/state')).json();

const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), FLOOR = -2.75, CAPE_C = V(0, -2.08, -0.19), CAPE_R = V(2.02, 0.72, 1.18);
const SEG = 10, CSEG = 3, SPEED = 8; // segments per guide and per clipping; replay steps per second
const rnd = (k = 1) => (Math.random() - 0.5) * 2 * k;
const std = (color, roughness = 0.5, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness, metalness });

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d23);
scene.fog = new THREE.Fog(0x1a1d23, 11, 26);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.1, 1.35, 6.0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.04, -0.25);
controls.enableDamping = true;
const sun = new THREE.DirectionalLight(0xffeee1, 2.05);
sun.position.set(3, 5, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 24 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.012;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9db8ff, 0.9); // cool light from behind, to lift the silhouette
rim.position.set(-4, 3, -5);
scene.add(rim);

// ---------- head and scalp ----------
const ROWS = R.grid.length - 1, COLS = R.grid[0].length;
function radiusAt(d, rows, cols, sample) {
  const u = Math.acos(THREE.MathUtils.clamp(d.y, -1, 1)) / Math.PI * rows;
  const v = (Math.atan2(d.x, d.z) / (2 * Math.PI) + 1) % 1 * cols;
  const i = Math.min(Math.floor(u), rows - 1), j = Math.floor(v) % cols, j1 = (j + 1) % cols;
  return THREE.MathUtils.lerp(
    THREE.MathUtils.lerp(sample(i, j), sample(i, j1), v - j),
    THREE.MathUtils.lerp(sample(i + 1, j), sample(i + 1, j1), v - j), u - i);
}
const simSample = (i, j) => R.grid[i][j];
const skinAt = d => radiusAt(d, ROWS, COLS, simSample);
const cellDirs = R.cells.map(c => V(...c));
function groomCell(d) { // extend the nearest cut cell to the natural hairline
  let best = -1, most = -Infinity;
  cellDirs.forEach((c, i) => { const t = c.dot(d); if (t >= most) { most = t; best = i; } });
  return best;
}

const smooth = THREE.MathUtils.smoothstep;
const tmp = V();
const BUZZ_SCALE = 0.55;

function hairline(n) {
  // Temples sit higher than the center of the forehead, and the sides clear the ears.
  const front = smooth(n.z, 0.25, 0.82);
  const side = smooth(Math.abs(n.x), 0.20, 0.90);
  const edge = -0.23 + 0.60 * front + 0.27 * side * (0.7 + 0.3 * front);
  const overEar = 0.22 * smooth(Math.abs(n.x), 0.75, 0.96) * (1 - smooth(Math.abs(n.z + 0.04), 0.07, 0.40));
  return n.y - edge - overEar + 0.006 * Math.sin(53 * n.x + 18 * n.z);
}

// Fit the crown and back to the simulator while leaving the scan's temples and ears intact.
const { scene: portrait } = await new GLTFLoader().loadAsync(HEAD_SCAN || './assets/head-scan.glb');
// The bundled profile stores the outer surface of the aligned scan as little-endian radii.
const profile = portrait.userData.scalpProfile;
const scanRadii = Uint8Array.from(atob(profile.radii), c => c.charCodeAt(0));
function scanSample(i, j) {
  const k = 2 * (i * profile.cols + j);
  return (scanRadii[k] + 256 * scanRadii[k + 1]) / profile.scale;
}
function crownFit(n) {
  const crown = smooth(n.y, 0.40, 0.80);
  const back = (1 - smooth(n.z, -0.80, -0.25)) * smooth(n.y, -0.35, 0.22);
  return 0.75 * Math.max(crown, back);
}
function portraitRadius(n) {
  const scan = radiusAt(n, profile.rows, profile.cols, scanSample);
  return scan > 0 ? THREE.MathUtils.lerp(scan, skinAt(n), crownFit(n)) : skinAt(n);
}
const on = (x, y, z) => { const d = V(x, y, z).normalize(); return d.multiplyScalar(portraitRadius(d)); };
const model = portrait.children[0];
const skinGeo = model.geometry;
const skinPos = skinGeo.attributes.position;
const scalpWeights = [], scalpLengths = Array(R.cells.length).fill(-1);
const colors = new Float32Array(skinPos.count * 3).fill(1);
const n = V(), scanPoint = V();
for (let i = 0; i < skinPos.count; i++) {
  scanPoint.fromBufferAttribute(skinPos, i);
  scanPoint.set((scanPoint.x + 0.09) * 0.48, (scanPoint.y - 1.49) * 0.416, (scanPoint.z - 0.25) * 0.47);
  n.copy(scanPoint).normalize();
  const edge = hairline(n);
  const fit = crownFit(n);
  if (fit > 0) scanPoint.lerp(tmp.copy(n).multiplyScalar(skinAt(n)), fit);
  skinPos.setXYZ(i, scanPoint.x, scanPoint.y, scanPoint.z);
  const cell = groomCell(n);
  if (edge > 0) scalpWeights.push({ i, cell, weight: smooth(edge, 0, 0.09) });
}
skinGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3).setUsage(THREE.DynamicDrawUsage));
skinGeo.computeVertexNormals();
skinGeo.computeBoundingSphere();
model.material.vertexColors = true;
model.material.onBeforeCompile = shader => {
  shader.vertexShader = 'varying vec3 scanPosition;\n' + shader.vertexShader.replace('#include <begin_vertex>',
    '#include <begin_vertex>\nscanPosition = position;');
  shader.fragmentShader = 'varying vec3 scanPosition;\n' + shader.fragmentShader.replace('#include <color_fragment>',
    `#include <color_fragment>
     float neckline = -1.29 + 0.13 * smoothstep(0.06, 0.65, abs(scanPosition.x));
     float edge = scanPosition.y - neckline;
     float fabric = 1.0 - smoothstep(-0.012, 0.006, edge);
     float trim = fabric * smoothstep(-0.060, -0.034, edge);
     vec3 cloth = mix(vec3(0.023, 0.035, 0.053), vec3(0.64, 0.62, 0.57), trim);
     diffuseColor.rgb = mix(diffuseColor.rgb, cloth, fabric);`);
};
model.castShadow = model.receiveShadow = true;
scene.add(portrait);

function shadeScalp(lengths) {
  if (lengths.every((length, i) => length === scalpLengths[i])) return;
  const color = skinGeo.attributes.color;
  for (const { i, cell, weight } of scalpWeights) {
    if (lengths[cell] === scalpLengths[cell]) continue;
    const density = weight * smooth(lengths[cell], 0.001, 0.090);
    color.setXYZ(i, 1 - 0.89 * density, 1 - 0.91 * density, 1 - 0.92 * density);
  }
  lengths.forEach((length, i) => { scalpLengths[i] = length; });
  color.needsUpdate = true;
}

const headGeo = new THREE.IcosahedronGeometry(1, 42);
headGeo.deleteAttribute('normal');
headGeo.deleteAttribute('uv');
const surface = mergeVertices(headGeo);
headGeo.dispose();
const head = new THREE.Mesh(surface, new THREE.MeshBasicMaterial()); // click target; the portrait is what you see
for (let i = 0; i < surface.attributes.position.count; i++) {
  n.fromBufferAttribute(surface.attributes.position, i).normalize();
  n.multiplyScalar(skinAt(n));
  surface.attributes.position.setXYZ(i, n.x, n.y, n.z);
}

// Target layer (T): a faint shell at the target length above the scalp.
let shell = null;
if (R.target > 0) {
  const P = surface.attributes.position, index = surface.index.array, pos = new Float32Array(P.count * 3), hairy = new Uint8Array(P.count), v = V(), keep = [];
  for (let i = 0; i < P.count; i++) {
    v.fromBufferAttribute(P, i);
    const d = tmp.copy(v).normalize();
    hairy[i] = hairline(d) > 0;
    v.setLength(portraitRadius(d) + R.target * BUZZ_SCALE).toArray(pos, i * 3);
  }
  for (let t = 0; t < index.length; t += 3) if (hairy[index[t]] && hairy[index[t + 1]] && hairy[index[t + 2]]) keep.push(index[t], index[t + 1], index[t + 2]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(keep);
  shell = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x7fd7ff, transparent: true, opacity: 0.25, depthWrite: false, side: THREE.DoubleSide }));
  shell.visible = false;
  scene.add(shell);
}

// ---------- body and room ----------
function part(geo, mat, pos, scale, parent = scene) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  if (scale) mesh.scale.copy(scale);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
const ball = new THREE.SphereGeometry(1, 32, 20);
part(ball, std(0x2a3542, 0.95), CAPE_C, CAPE_R);                                                // barber's cape

const tile = document.createElement('canvas');
tile.width = tile.height = 128;
const ink = tile.getContext('2d');
ink.fillStyle = '#34373e'; ink.fillRect(0, 0, 128, 128);
ink.fillStyle = '#25282e'; ink.fillRect(0, 0, 64, 64); ink.fillRect(64, 64, 64, 64);
const tiles = new THREE.CanvasTexture(tile);
tiles.wrapS = tiles.wrapT = THREE.RepeatWrapping;
tiles.repeat.set(24, 24);
tiles.colorSpace = THREE.SRGBColorSpace;
tiles.anisotropy = 8;
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ map: tiles, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR;
floor.receiveShadow = true;
scene.add(floor);

// ---------- hair: a sparse guide simulation drives a dense coat on the GPU ----------
const tangent = (v, n) => v.addScaledVector(n, -v.dot(n)); // drop the part of v along n
const uncut = R.frames[0].len;
const guides = [], byCell = R.cells.map(() => []);
let groomSeed = 271828; // stable roots, color and grooming across reloads
const groomRandom = () => ((groomSeed = (Math.imul(groomSeed, 1664525) + 1013904223) >>> 0) / 2 ** 32);
const jitter = width => (2 * groomRandom() - 1) * width;
function rootDirections(count, scatter, visit) {
  for (let i = 0; i < count; i++) {
    const y = 1 - 2 * (i + 0.5) / count, r = Math.sqrt(1 - y * y), phi = i * 2.399963;
    const n = V(Math.cos(phi) * r + jitter(scatter), y + jitter(scatter), Math.sin(phi) * r + jitter(scatter)).normalize();
    if (hairline(n) > 0.018 * groomRandom()) visit(n, groomCell(n));
  }
}
function addGuide(n, cell) {
  // An off-center part separates the front into two swept sections.
  const front = smooth(n.z, 0.12, 0.78);
  const part = -0.25 - 0.12 * n.z;
  const side = n.x < part ? -1 : 1;
  const lay = tangent(V(side * (0.40 + 0.76 * front), -0.62 + 0.53 * front, -0.32 - 0.22 * front), n).normalize();
  const across = V().crossVectors(n, lay);
  const wave = 0.13 + groomRandom() * 0.14;
  const phase = n.x * 10 + n.z * 6;
  const rest = Array.from({ length: SEG }, (_, i) => {
    const t = (i + 0.5) / SEG;
    return lay.clone()
      .addScaledVector(n, 0.24 * Math.exp(-6 * t) + 0.11 * Math.sin(8 * t + phase))
      .addScaledVector(UP, -1.12 * smooth(t, 0.06, 0.86))
      .addScaledVector(across, wave * Math.sin(10 * t + phase) * smooth(t, 0.0, 0.46)).normalize();
  });
  const groomLength = 1.48 + 0.25 * n.y - 0.24 * front - 0.17 * n.z + 0.17 * Math.sin(7 * n.x + 4 * n.z);
  const stub = n.clone().addScaledVector(lay, 0.24).normalize();
  const s = {
    cell, n, rest, stub, groomLength, i: guides.length, root: n.clone().multiplyScalar(portraitRadius(n) - 0.002),
    shade: 0.82 + groomRandom() * 0.42, p: Array.from({ length: SEG + 1 }, () => V()),
    o: Array.from({ length: SEG + 1 }, () => V()), L: 0, still: 0, dirty: true,
  };
  guides.push(s);
  byCell[cell].push(s);
}
rootDirections(1350, 0.010, addGuide);
for (let i = 0; i < byCell.length; i++) if (!byCell[i].length) addGuide(cellDirs[i], i);

const BROWN = new THREE.Color(0x291b16), GREEN = new THREE.Color(0x3ddc84), RED = new THREE.Color(0xff4d4d), col = new THREE.Color();
let tint = false;
const strandGeo = new THREE.CylinderGeometry(0.0045, 0.0065, 1, 5).translate(0, 0.5, 0);
const hairMat = std(0xffffff, 0.5);
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = V(), a = V(), dir = V(), nrm = V();
const ONE = V(1, 1, 1);

// Positions relative to the root and smoothed tangents, packed into two texels per node.
const curveWidth = (SEG + 1) * 2;
const curveData = new Float32Array(curveWidth * guides.length * 4);
const curveMap = new THREE.DataTexture(curveData, curveWidth, guides.length, THREE.RGBAFormat, THREE.FloatType);
const fibers = [];
const roots = [], rotations = [], styles = [], rows = [], normals = [];
rootDirections(41000, 0.0035, (n, cell) => {
  let best = -Infinity, guide;
  for (const g of byCell[cell]) {
    const dot = g.n.dot(n);
    if (dot > best) { best = dot; guide = g; }
  }
  const root = n.clone().multiplyScalar(portraitRadius(n) - 0.002);
  const flyaway = groomRandom() < 0.04;
  normals.push(n.x, n.y, n.z);
  roots.push(root.x, root.y, root.z);
  rotations.push(...q.setFromUnitVectors(guide.n, n).toArray());
  styles.push(0.0022 + groomRandom() * 0.0014, 0.97 + jitter(flyaway ? 0.16 : 0.055), jitter(flyaway ? 0.10 : 0.028), jitter(flyaway ? 0.09 : 0.026));
  rows.push((guide.i + 0.5) / guides.length);
  fibers.push({ cell, shade: guide.shade * (0.78 + groomRandom() * 0.44) });
});
const fiberGeo = new THREE.InstancedBufferGeometry();
const rings = [], indices = [], sides = 3;
for (let i = 0; i <= SEG; i++) for (let j = 0; j < sides; j++) {
  const angle = 2 * Math.PI * j / sides;
  rings.push(Math.cos(angle), Math.sin(angle), i);
  if (i < SEG) {
    const x = i * sides + j, y = i * sides + (j + 1) % sides;
    indices.push(x, y, x + sides, y, y + sides, x + sides);
  }
}
fiberGeo.setAttribute('position', new THREE.Float32BufferAttribute(rings, 3));
fiberGeo.setIndex(indices);
for (const [key, data, size] of [['fiberRoot', roots, 3], ['fiberRotation', rotations, 4], ['fiberStyle', styles, 4], ['fiberRow', rows, 1], ['fiberNormal', normals, 3]]) {
  fiberGeo.setAttribute(key, new THREE.InstancedBufferAttribute(new Float32Array(data), size));
}
fiberGeo.instanceCount = fibers.length;
const tints = new THREE.InstancedBufferAttribute(new Float32Array(fibers.length * 3), 3);
fiberGeo.setAttribute('color', tints);

const fiberSource = /* glsl */ `
  uniform sampler2D hairCurves;
  attribute vec3 fiberRoot;
  attribute vec4 fiberRotation;
  attribute vec4 fiberStyle;
  attribute float fiberRow;
  attribute vec3 fiberNormal;
  vec3 rotateFiber(vec3 p) {
    vec3 q = fiberRotation.xyz;
    return p + 2.0 * cross(q, cross(q, p) + fiberRotation.w * p);
  }
  void fiberVertex(out vec3 point, out vec3 normal) {
    float node = position.z * 2.0;
    vec4 curve = texture2D(hairCurves, vec2((node + 0.5) / ${curveWidth}.0, fiberRow));
    if (curve.w < 0.5) { point = fiberRoot; normal = vec3(0., 1., 0.); return; }
    vec4 frame = texture2D(hairCurves, vec2((node + 1.5) / ${curveWidth}.0, fiberRow));
    vec3 along = rotateFiber(frame.xyz);
    vec3 across = cross(along, fiberNormal);
    if (dot(across, across) < 0.003) across = cross(along, abs(along.y) < 0.95 ? vec3(0., 1., 0.) : vec3(0., 0., 1.));
    across = normalize(across);
    normal = position.x * across + position.y * cross(along, across);
    float t = position.z / ${SEG}.0;
    vec3 spread = fiberStyle.z * across + fiberStyle.w * fiberNormal;
    float lengthScale = mix(1.0, fiberStyle.y, step(1.5, curve.w));
    float taper = mix(1.0, curve.w > 1.5 ? 0.20 : 0.88, t * t);
    point = fiberRoot + rotateFiber(curve.xyz) * lengthScale + spread * frame.w * t * t + normal * taper * fiberStyle.x;
  }
`;
function curveMaterial(material, depth = false) {
  material.onBeforeCompile = shader => {
    shader.uniforms.hairCurves = { value: curveMap };
    shader.vertexShader = fiberSource + shader.vertexShader;
    if (!depth) shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>',
      'vec3 fiberPoint, objectNormal; fiberVertex(fiberPoint, objectNormal);');
    shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', depth
      ? 'vec3 transformed, fiberNormal; fiberVertex(transformed, fiberNormal);'
      : 'vec3 transformed = fiberPoint;');
  };
  return material;
}
const coatMat = curveMaterial(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.66, sheen: 0.45, sheenRoughness: 0.72, sheenColor: 0x906647 }));
const hair = new THREE.Mesh(fiberGeo, coatMat);
hair.customDepthMaterial = curveMaterial(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), true);
hair.castShadow = true;
hair.frustumCulled = false;
scene.add(hair);

function paint(F) {
  for (let i = 0; i < fibers.length; i++) {
    const { cell, shade } = fibers[i], score = F.scores[cell];
    col.copy(BROWN).multiplyScalar(shade).lerp(score < 0 ? RED : GREEN, tint ? Math.abs(score) * 0.85 : 0);
    col.toArray(tints.array, i * 3);
  }
  tints.needsUpdate = true;
}

function pointAt(points, L, arc, out) { // sample along the strand, from the root
  const t = arc * SEG / L, i = Math.min(Math.floor(t), SEG - 1);
  return out.copy(points[i]).lerp(points[i + 1], t - i);
}
function setLength(s, length, falls, reset) {
  // Close cuts keep their relative measured lengths. Only longer hair gets the extra drape.
  const long = smooth(length, 0.19, uncut[s.cell]);
  const L = length * BUZZ_SCALE + long * (s.groomLength - uncut[s.cell] * BUZZ_SCALE);
  if (L === s.L && !reset) return;
  if (falls && L < s.L) spawnClip(s, L);
  if (!reset && L < s.L && L >= 0.13) { // keep the shape and momentum of the remaining stub
    // Source indices never exceed the destination index, so work backwards in place.
    for (let i = SEG; i > 0; i--) {
      pointAt(s.p, s.L, i * L / SEG, tmp); s.p[i].copy(tmp);
      pointAt(s.o, s.L, i * L / SEG, tmp); s.o[i].copy(tmp);
    }
  } else {
    s.p[0].copy(s.root);
    for (let i = 1; i <= SEG; i++) {
      s.p[i].copy(s.p[i - 1]).addScaledVector(L < 0.13 ? s.stub : s.rest[i - 1], L / SEG);
    }
    s.p.forEach((pt, i) => s.o[i].copy(pt));
  }
  s.L = L;
  s.still = 0;
  s.dirty = true;
}
function uploadHair() {
  let changed = false;
  for (const s of guides) {
    if (!s.dirty) continue;
    const mode = s.L < 0.004 ? 0 : s.L > 0.20 ? 2 : 1;
    for (let i = 0; i <= SEG; i++) {
      const k = (s.i * curveWidth + i * 2) * 4;
      tmp.copy(s.p[i]).sub(s.root).toArray(curveData, k);
      curveData[k + 3] = mode;
      tmp.copy(s.p[Math.min(i + 1, SEG)]).sub(s.p[Math.max(i - 1, 0)]).normalize().toArray(curveData, k + 4);
      curveData[k + 7] = s.L;
    }
    s.dirty = false;
    changed = true;
  }
  if (changed) curveMap.needsUpdate = true;
}

const TICK = 1 / 60, PASSES = 4;
const bladePrev = V(), bladeNow = V(), bladeAxis = V(), bladePrevAxis = V(), bladeMove = V(), bladeAcross = V();
const bladeClosest = V(), bladeSample = V(), sampleAxis = V(), clipPush = V();

// ---------- clippings: what the blade cuts off keeps its curl, falls, tumbles and settles ----------
const MAXC = 5000, clipData = [];

let clipNext = 0;
function spawnClip(s, newL) {

  const pts = Array.from({ length: CSEG + 1 }, (_, j) => pointAt(s.p, s.L, newL + cut * j / CSEG, V()));

  const inv = c.q.clone().invert();

function show(step, animateCut = true) {

}

addEventListener('keydown', e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === 'c') { tint = !tint; paint(R.frames[k]); return; }
  if (key === 't' && shell) { shell.visible = !shell.visible; return; }
  if (key === 'v') {
    agentView = (agentView + 1) % 3;
    feeds.hidden = agentView !== 0;
    viewLabel.hidden = agentView === 0;
    viewLabel.textContent = agentView === 1 ? orbitFeed.textContent : bladeFeed.textContent;
    return;
  }
  if (!LIVE) {
    if (key === ' ') { e.preventDefault(); setPlaying(!playing); }
    if (key === 'ArrowRight') { setPlaying(false); show(Math.min(k + 1, last())); }
    if (key === 'ArrowLeft') { setPlaying(false); show(Math.max(k - 1, 0)); }
    return;
  }
  const size = e.shiftKey ? 0.02 : 0.1, rise = e.shiftKey ? 0.01 : 0.05, bend = e.shiftKey ? 0.02 : 0.1;
  const digit = e.code.startsWith('Digit') ? +e.code[5] : 0; // 1/2 yaw, 3/4 shoulder, 5/6 elbow, 7/8 wrist
  const job = digit >= 1 && digit <= 8 ? () => turn((digit - 1) >> 1, digit % 2 ? -bend : bend) : {
    ArrowLeft: () => slide(0, -size), ArrowRight: () => slide(0, size), ArrowUp: () => slide(1, size), ArrowDown: () => slide(1, -size),
    w: () => lift(rise), s: () => lift(-rise), ' ': () => act('cut'), Enter: () => act('done'), n: newHead,
    j: () => aim(-0.3, 0), l: () => aim(0.3, 0), i: () => aim(0, 0.2), k: () => aim(0, -0.2),
  }[key];

  if (playing) {
    acc += dt * SPEED;
    if (acc >= 1) { acc -= 1; show(Math.min(k + 1, last())); }
    if (k === last()) setPlaying(false);
  }
  tipWas.copy(tip);
  armNow.forEach((p, i) => p.lerp(armGoal[i], ease));
  tipVel.copy(tip).sub(tipWas).divideScalar(Math.max(dt, 1e-3));
  poseArm();
  orbitCam.position.lerp(eyeGoal, 1 - Math.exp(-dt * 6)).setLength(EYE);
  aimCameras();
  hairClock = Math.min(hairClock + dt, 3 * TICK);
  const ticks = Math.floor(hairClock / TICK);
  for (let i = 0; i < ticks; i++) {
    bladeNow.copy(bladePrev).lerp(tip, 1 / (ticks - i));
    bladeAxis.copy(bladePrevAxis).lerp(ax, 1 / (ticks - i)).normalize();
    simulateHair(true);
    hairClock -= TICK;
  }
  if (ticks) uploadHair();
  simulateClips(dt);
  controls.update();
  renderer.shadowMap.needsUpdate = true;
  if (agentView) renderAgentView(agentView === 1 ? orbitCam : bladeCam, 0, 0, innerWidth, innerHeight);
  else {
    renderer.setViewport(0, 0, innerWidth, innerHeight);
    renderer.setScissor(0, 0, innerWidth, innerHeight);
    renderer.render(scene, camera);
    renderFeed(orbitCam, orbitFeed);
    renderFeed(bladeCam, bladeFeed);
  }
});
</script>
</body>
</html>
